name: Security Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  trivy-scan:
    name: Aqua Security Trivy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # Required to upload SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aqua Security Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'                  # Options: fs, image, repo, config, sbom
          scan-ref: '.'                    # Path to scan
          format: 'sarif'                  # Output format: table, json, sarif, template
          output: 'trivy-results.sarif'    # Output file
          severity: 'CRITICAL,HIGH'        # Severities to report
          ignore-unfixed: true             # Ignore vulnerabilities without fixes
          exit-code: '1'                   # Fail the job if vulnerabilities found

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()  # Upload even if previous step fails
        with:
          sarif_file: 'trivy-results.sarif'